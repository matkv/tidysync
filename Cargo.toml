[package]
name = "tidysync"
version = "0.1.0"
edition = "2024"
# std::fs::File::try_lock, used for the single-instance lock, stabilised in 1.89.
rust-version = "1.89"

[dependencies]
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time", "sync", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
toml = "0.8"
dirs = "5"
walkdir = "2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["chrono", "env-filter"] }
dotenvy = "0.15.7"

[dev-dependencies]
tempfile = "3.27.0"
